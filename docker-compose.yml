services:
  oracle:
    image: gvenzl/oracle-free:23-slim-faststart
    environment:
      ORACLE_PASSWORD: oracle
      APP_USER: loanflow
      APP_USER_PASSWORD: loanflow
    ports:
      - "1521:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30

  rabbitmq:
    image: rabbitmq:4-management
    ports:
      - "5672:5672"
      - "15672:15672"

  keycloak:
    image: keycloak/keycloak:26.4
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    ports:
      - "8180:8080"
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import:ro

  bureau:
    image: wiremock/wiremock:3.13.2
    ports:
      - "8090:8080"
    volumes:
      - ./infra/bureau:/home/wiremock:ro

  app:
    build: .
    depends_on:
      oracle:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      keycloak:
        condition: service_started
    environment:
      DB_URL: jdbc:oracle:thin:@oracle:1521/FREEPDB1
      RABBIT_HOST: rabbitmq
      KEYCLOAK_ISSUER: http://localhost:8180/realms/loanflow
      KEYCLOAK_JWKS: http://keycloak:8080/realms/loanflow/protocol/openid-connect/certs
      BUREAU_URL: http://bureau:8080
    ports:
      - "8080:8080"
    restart: on-failure

volumes:
  oracle-data:
